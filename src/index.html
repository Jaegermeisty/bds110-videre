<!doctype html>
<html lang="nb">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Uoffisiell studentprototype: tydelig, personlig og handlingsrettet informasjon ved togforsinkelser.">
<title>Go-Ahead · BDS110 Showcase</title>
<style>/* STYLES */</style>
</head>
<body>
<main class="showcase">
<section class="intro" aria-label="Om reisen"><div class="eyebrow" id="story-label">REISEN TIL NORA</div><h1 id="story-title">Nora skal<br><span>til Stavanger.</span></h1><p class="intro-copy" id="story-copy">Hun tar toget fra Sandnes sentrum kl. 07.42.</p></section>
<section class="demo-center" aria-label="Interaktiv reiseapp"><div class="phone-stage"><div class="phone"><div class="screen" id="screen"><div class="statusbar"><span id="clock">07.32</span><div class="island"></div><div class="system-icons"><span data-icon="signal"></span><span data-icon="wifi"></span><span data-icon="battery"></span></div></div><div class="app-brand"><img class="go-ahead-logo" src="GO_AHEAD_LOGO" alt="Go-Ahead Nordic"></div><div class="app-scroll" id="app-scroll"><div id="app-content"></div></div><nav class="app-nav" aria-label="Appnavigasjon"><button data-action="journey" id="nav-journey" class="active"><span data-icon="ticket"></span>Min reise</button><button data-action="notifications" id="nav-notifications"><span data-icon="bell"></span><span>Varsler <span id="notification-count"></span></span></button></nav><div class="home-indicator"></div></div></div></div><div class="presenter-controls"><button class="simulate" id="simulate" data-action="advance"><span data-icon="play"></span><span>Simuler forsinkelse</span></button><button class="reset" data-action="reset" aria-label="Nullstill demonstrasjonen" title="Nullstill demonstrasjonen"><span data-icon="reset"></span></button></div></section>
<aside class="explanation" aria-label="Steg i demoen"><ol class="demo-steps"><li id="step-0" aria-current="step"><span class="step-dot">1</span><span>Reisen</span></li><li id="step-1"><span class="step-dot">2</span><span>Forsinkelsen</span></li><li id="step-2"><span class="step-dot">3</span><span>Hva nå?</span></li></ol><button class="text-button sms-link" data-action="channels">Se SMS <span data-icon="arrow"></span></button></aside>
</main>
<dialog id="channels-dialog" aria-labelledby="dialog-title"><button class="dialog-close reset" data-action="close-dialog" aria-label="Lukk SMS"><span data-icon="close"></span></button><h2 id="dialog-title">Samme beskjed<br>i app og SMS.</h2><div class="channel-tabs"><span data-icon="phone"></span> App <span data-icon="arrow"></span><span data-icon="message"></span> SMS</div><div class="sms" id="sms"></div></dialog>
<div class="sr-only" aria-live="polite" id="announcer"></div>
<script>/* SCRIPT */</script>
</body></html>
