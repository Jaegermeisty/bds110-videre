function normal(){return `<div class="app-title-row"><div><p class="app-subtitle">God morgen, Nora</p><h1>Din neste reise</h1></div><span class="avatar" aria-label="Nora">N</span></div><div class="date-row"><span>Tirsdag 3. november</span><span>Fast pendlerreise</span></div><article class="journey-card"><div class="journey-top"><span class="line-label"><span class="line-badge">L5</span> Jærbanen</span><span class="status-pill">${icon('check')} I rute</span></div><div class="route"><div class="station"><span class="station-time">07.42</span><span class="station-node"></span><div class="station-name">Sandnes sentrum<span class="station-note">Avgang · spor 1</span></div></div><div class="station"><span class="station-time">07.59</span><span class="station-node"></span><div class="station-name">Stavanger<span class="station-note">Ankomst</span></div></div></div><div class="journey-bottom"><span>${icon('clock')} 17 min · direkte</span><span>Go-Ahead Nordic</span></div></article><h2 class="section-heading">På vei til Stavanger</h2><div class="route-illustration" role="img" aria-label="Forenklet ruteskisse: Sandnes sentrum, Gausel, Jåttåvågen, Mariero, Paradis og Stavanger. Ikke et kart."><div class="map-line"><span></span><span></span><span></span><span></span><span></span><span></span></div><div class="map-labels"><strong>Sandnes</strong><span>Gausel</span><span>Jåttåvågen</span><strong>Stavanger</strong></div></div>${setting()}<p class="app-footnote">Sist oppdatert 07.32</p>`;}
function disruption(){const u=update();return `<div class="app-title-row"><div><p class="app-subtitle">Tirsdag 3. november</p><h1>Din reise er berørt</h1></div></div>${compact()}<article class="disruption"><div class="disruption-heading">${icon('warning')}<div><h2>Toget ditt er forsinket</h2><small>${u.status}</small></div></div><div class="message-sections"><section class="message-section"><h3><span>01</span> Hva har skjedd?</h3><p>L5 kl. 07.42 fra Sandnes sentrum er forsinket på grunn av en signalfeil.</p></section><section class="message-section"><h3><span>02</span> Hva betyr det for reisen din?</h3><p>${u.impact}</p></section><section class="message-section"><h3><span>03</span> Hva kan du gjøre nå?</h3><p>Se mulighetene dine nedenfor. Buss for tog er ikke bekreftet. Vi oppdaterer deg senest kl. ${u.next}.</p></section></div></article><div class="update-strip"><span>Oppdatert <strong>${u.time}</strong></span><span>Neste beskjed senest <strong>${u.next}</strong></span></div><button class="primary" data-action="alternatives">Se alternative reiser ${icon('arrow')}</button><p class="personal-note">${icon('bell')}<span>${alerts?'Du følger denne reisen. Nye varsler vises i appen.':'Varsler er av. Du kan følge oppdateringer her.'}</span></p>`;}
function alternatives(){const u=update();return `<button class="back" data-action="journey">${icon('back')} Min reise</button><div class="app-title-row"><div><h1>Veien videre</h1></div></div>${compact()}<div class="notice">${icon('warning')}<span>Ingen bekreftet erstatningstransport.<br>Sjekk status før du endrer reisen.</span></div><article class="option"><div class="option-top"><h2>${icon('rail')} Neste planlagte tog</h2><span class="tag">Ikke bekreftet</span></div><p><strong>L5 kl. 08.12 → 08.29</strong><br>Samme strekning. Avgangen kan også bli berørt av signalfeilen. Tidene er rutetider.</p><button class="text-button" data-action="detail" aria-expanded="${detail}">${detail?'Skjul vurderingen':'Hva bør jeg vurdere?'} ${icon('arrow')}</button>${detail?'<div class="alt-detail">Ikke regn med kl. 08.12 som en bekreftet løsning. Vent på oppdatert trafikkstatus før du velger denne avgangen. Det er ikke avklart om togbilletten gjelder på ordinær buss.</div>':''}</article><article class="option"><div class="option-top"><h2>${icon('clock')} Følg din opprinnelige reise</h2></div><p>${phase===2?'Anslått avgang er 07.57. Anslaget kan endre seg.':'Avgangstid er foreløpig ukjent.'} Neste beskjed kommer senest kl. ${u.next}, også hvis situasjonen er uendret.</p><button class="text-button" data-action="journey">Tilbake til reiseoppdateringen ${icon('arrow')}</button></article>`;}
function notifications(){return `<div class="app-title-row"><div><p class="app-subtitle">Tilpasset reisen din</p><h1>Varsler</h1></div></div>${phase&&alerts?`<button class="notification-item" data-action="journey"><span><span>DIN PENDLERREISE</span><span>${update().time}</span></span><strong>L5 kl. 07.42 er forsinket</strong><p>Sandnes sentrum → Stavanger.<br>${update().status}. Neste beskjed senest ${update().next}.</p><span style="margin:12px 0 0;color:var(--blue)">Åpne reiseoppdateringen →</span></button>`:`<div class="empty-state">${icon('bell')}<h2>${alerts?'Ingen nye varsler':'Varsler er slått av'}</h2><p>${alerts?'Når noe endrer seg for reisen din, finner du beskjeden her.':'Du kan fortsatt se oppdatert status under Min reise.'}</p></div>`}${setting()}`;}
function renderStory(){
 const step=phase===0?0:phase===2||view==='alternatives'?2:1;
 const story=step===0
  ? {label:'REISEN TIL NORA',title:'Nora skal<br><span>til Stavanger.</span>',copy:'Hun tar toget fra Sandnes sentrum kl. 07.42.'}
  : view==='alternatives'
  ? {label:'HVA NÅ?',title:'Hva kan hun<br><span>gjøre nå?</span>',copy:'Hun kan sjekke neste tog. Appen sier fra om at også det kan bli forsinket.'}
  : phase===2
  ? {label:'NY BESKJED KL. 07.40',title:'Toget kan gå<br><span>kl. 07.57.</span>',copy:'Den nye tiden er et anslag. Nora får en ny beskjed senest kl. 07.45.'}
  : {label:'TOGET ER FORSINKET',title:'Hva betyr det<br><span>for Nora?</span>',copy:'Hun får vite at toget er forsinket, og når hun får mer informasjon.'};
 document.getElementById('story-label').textContent=story.label;
 document.getElementById('story-title').innerHTML=story.title;
 document.getElementById('story-copy').textContent=story.copy;
 document.querySelectorAll('.demo-steps li').forEach((el,i)=>{
  el.classList.toggle('complete',i<step);
  if(i===step)el.setAttribute('aria-current','step');else el.removeAttribute('aria-current');
 });
}
function render(){renderStory();document.getElementById('app-content').innerHTML=view==='notifications'?notifications():view==='alternatives'?alternatives():phase?disruption():normal();document.getElementById('clock').textContent=phase?update().time:'07.32';document.getElementById('nav-journey').classList.toggle('active',view!=='notifications');document.getElementById('nav-notifications').classList.toggle('active',view==='notifications');document.getElementById('notification-count').innerHTML=phase&&alerts?'<span class="notification-dot" aria-label="Nytt varsel"></span>':'';const btn=document.getElementById('simulate');btn.disabled=phase===2;btn.innerHTML=icon(phase===0?'play':phase===1&&view!=='alternatives'?'arrow':'clock')+`<span>${phase===0?'Simuler forsinkelse':phase===1&&view!=='alternatives'?'Hva kan Nora gjøre nå?':phase===1?'Vis oppdatering kl. 07.40':'Oppdatering vist'}</span>`;document.getElementById('sms').textContent=phase?`Go-Ahead · ${update().time}: Din L5-avgang kl. 07.42 fra Sandnes sentrum til Stavanger er forsinket på grunn av signalfeil. ${phase===2?'Anslått avgang 07.57, ankomst 08.14. Tidene er ikke bekreftet.':'Ny avgangstid er ukjent. Du kommer senere frem enn planlagt kl. 07.59.'} Buss for tog er ikke bekreftet. Neste beskjed senest ${update().next}. Se mulighetene dine i appen.`:'Ingen nye meldinger.';hydrate();}
function announce(text){document.getElementById('announcer').textContent=text;}
function navigate(next){view=next;detail=false;render();document.getElementById('app-scroll').scrollTop=0;const target=document.querySelector('#app-content h1');if(target){target.setAttribute('tabindex','-1');target.focus({preventScroll:true});}}
document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el)return;switch(el.dataset.action){case'advance':if(phase>=2)return;if(phase===1&&view!=='alternatives'){navigate('alternatives');announce('Se hva Nora kan gjøre nå.');break;}phase++;navigate('journey');announce(phase===1?'L5 klokken 07.42 er forsinket. Ny avgangstid er ukjent.':'Oppdatering klokken 07.40. Anslått avgang er 07.57.');break;case'reset':phase=0;alerts=true;document.querySelectorAll('dialog').forEach(dialog=>dialog.close());navigate('journey');announce('Demonstrasjonen er nullstilt. Toget er i rute.');break;case'journey':navigate('journey');break;case'notifications':navigate('notifications');break;case'alternatives':navigate('alternatives');break;case'toggle-alerts':alerts=!alerts;render();document.querySelector('.toggle')?.focus();announce(alerts?'Varsler er slått på.':'Varsler er slått av.');break;case'detail':detail=!detail;render();document.querySelector('[data-action="detail"]')?.focus();break;case'channels':render();document.getElementById('channels-dialog').showModal();break;case'close-dialog':document.getElementById('channels-dialog').close();break;}});
document.getElementById('channels-dialog').addEventListener('click',event=>{if(event.target===event.currentTarget){const r=event.currentTarget.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)event.currentTarget.close();}});
render();
</script>
</body></html>
